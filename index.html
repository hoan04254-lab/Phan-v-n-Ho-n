
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cloud Phone</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
}

header {
  padding: 20px;
  background: #172235;
  border-bottom: 1px solid #334155;
}

h1 {
  margin: 0;
  font-size: 24px;
}

.subtitle {
  color: #94a3b8;
  margin-top: 8px;
}

main {
  padding: 16px;
  max-width: 1100px;
  margin: auto;
}

.panel {
  background: #1e293b;
  padding: 16px;
  border-radius: 12px;
  margin-bottom: 20px;
}

input, button {
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-size: 15px;
}

input {
  width: 100%;
  margin: 8px 0;
  background: #0f172a;
  color: white;
  border: 1px solid #475569;
}

button {
  cursor: pointer;
  background: #2563eb;
  color: white;
  margin: 4px;
}

button.stop {
  background: #dc2626;
}

button:active {
  opacity: 0.7;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

.device {
  background: #1e293b;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #334155;
}

.device h3 {
  margin-top: 0;
}

.status {
  color: #fbbf24;
  margin: 10px 0;
}

.online {
  color: #4ade80;
}

.note {
  color: #94a3b8;
  font-size: 13px;
  line-height: 1.5;
}
</style>
</head>

<body>

<header>
  <h1>☁️ My Cloud Phone</h1>
  <div class="subtitle">Quản lý Android Cloud Phone</div>
</header>

<main>

  <div class="panel">
    <h2>Kết nối máy chủ</h2>

    <label>API Server URL</label>
    <input id="apiUrl"
      placeholder="https://your-server.example.com">

    <button onclick="connectServer()">Kết nối</button>

    <p id="connectionStatus" class="status">
      Chưa kết nối máy chủ
    </p>

    <p class="note">
      Website hiện là giao diện mẫu. Cần backend API và
      dịch vụ Android Cloud Phone để điều khiển máy thật.
    </p>
  </div>

  <h2>Danh sách 20 Cloud Phone</h2>

  <div id="devices" class="grid"></div>

</main>

<script>
const API = () => document.getElementById("apiUrl").value.trim();

function renderDevices() {
  const container = document.getElementById("devices");

  container.innerHTML = "";

  for (let i = 1; i <= 20; i++) {
    const card = document.createElement("div");

    card.className = "device";

    card.innerHTML = `
      <h3>📱 Android ${i}</h3>

      <div class="status" id="status-${i}">
        Chưa kết nối
      </div>

      <button onclick="startDevice(${i})">
        Khởi động
      </button>

      <button class="stop" onclick="stopDevice(${i})">
        Dừng máy
      </button>

      <button onclick="openDevice(${i})">
        Mở máy
      </button>
    `;

    container.appendChild(card);
  }
}

async function connectServer() {
  const url = API();

  if (!url) {
    alert("Hãy nhập địa chỉ API Server");
    return;
  }

  document.getElementById("connectionStatus").textContent =
    "Đang thử kết nối...";

  try {
    const response = await fetch(url + "/api/devices");

    if (!response.ok) {
      throw new Error("API lỗi");
    }

    document.getElementById("connectionStatus").textContent =
      "Đã kết nối máy chủ";

    document.getElementById("connectionStatus").className =
      "status online";

    alert("Kết nối thành công!");
  } catch (error) {
    document.getElementById("connectionStatus").textContent =
      "Không kết nối được. Máy chủ API chưa hoạt động.";

    alert("Chưa có API Server hoặc URL không đúng.");
  }
}

async function deviceAction(id, action) {
  const url = API();

  if (!url) {
    alert("Chưa nhập API Server.");
    return;
  }

  try {
    const response = await fetch(
      `${url}/api/devices/${id}/${action}`,
      { method: "POST" }
    );

    if (!response.ok) {
      throw new Error("API lỗi");
    }

    alert(`Đã gửi lệnh ${action} cho Android ${id}`);
  } catch (error) {
    alert("Không gửi được lệnh. Backend chưa được cài đặt.");
  }
}

function startDevice(id) {
  deviceAction(id, "start");
}

function stopDevice(id) {
  deviceAction(id, "stop");
}

function openDevice(id) {
  alert(
    "Android " + id +
    ": Cần tích hợp dịch vụ truyền màn hình Cloud Phone."
  );
}

renderDevices();
</script>

</body>
</html>
